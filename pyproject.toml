[project]
name = "rolesmith_ai"
dynamic = ["version"]
description = "Rolesmith: Automated job application agent via MCP"
authors = [
    { name = "pulkit017", email = "author@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2",
    "playwright",
    "pydantic>=2",
    "pydantic-settings",
    "reportlab"
]

[project.scripts]
rolesmith_ai = "rolesmith_ai.pipeline.__main__:main"
rolesmith_ai-mcp = "rolesmith_ai.server:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "pip-audit",
    "pytest-mock",
    "types-reportlab>=5.0.0.20260911",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/rolesmith_ai/branding.py"

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "I", "E402", "PLC0415", "PGH003", "PGH004", "RUF100"]
